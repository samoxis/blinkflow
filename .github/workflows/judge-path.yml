# README "Try it in ~2 min, no GPU", step by step, on a clean machine: no keys, no GPU, no simulator; then every test
# (verdict, control, check, wording), offline: tests/conftest.py fails any test that opens a network connection.
name: judge path
on: push
permissions:
  contents: read
jobs:
  judge-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: "1. The report (standard library only)"
        run: |
          python3 -m blinkflow.console report examples/purple-box/events.jsonl --out report
          test -s report/index.html
      - name: "2. Measure it again, offline"
        run: |
          pip install -r requirements-judge.txt
          cp -r examples/purple-box /tmp/pb
          python3 -m blinkflow.see /tmp/pb/window/snapshot.json --out /tmp/pb/window/evidence --reuse > /dev/null
      - name: The same evidence as the repo's, but for the two paths it names
        run: |
          python3 - <<'PY'
          import json
          a = json.load(open("/tmp/pb/window/evidence/evidence.json"))
          b = json.load(open("examples/purple-box/window/evidence/evidence.json"))
          diff = sorted(k for k in a.keys() | b.keys() if a.get(k) != b.get(k))
          print("differs only in:", diff)
          assert diff == ["clip", "snapshot"], diff  # both paths differ: the file was written again, here
          assert a["first_contact"]["brain_s"] == 10.903, a["first_contact"]
          PY
      - name: "3. The tests: verdict, control, check, wording (offline, no GPU, no keys)"
        run: |
          pip install -r requirements.txt pytest==9.2.0
          python3 -m pytest -q tests

  # The arm (results/arm.md): every measurement re-derived from the saved SAM 3.1 replies, the citation check,
  # the diff and the physics replayed to the same record hashes, offline, with no key and the network blocked.
  arm-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: The arm, re-checked offline
        run: |
          pip install -r requirements.txt
          env -u MODEL_API_KEY -u BASETEN_API_KEY python3 -m blinkflow.arm.recheck examples/arm --write /tmp/arm-recheck.json
          python3 -c "import json; r = json.load(open('/tmp/arm-recheck.json')); assert r['passed'] and r['offline']; print(json.dumps(r['physics']['determinism']))"
      - name: The arm's logic bug and spoken run, re-checked offline
        run: |
          for e in arm-bug2 arm-voice; do
            env -u MODEL_API_KEY -u BASETEN_API_KEY python3 -m blinkflow.arm.recheck examples/$e --write /tmp/$e.json
            python3 -c "import json, sys; r = json.load(open(sys.argv[1])); assert r['passed'] and r['offline'] and all(a['passed'] for a in r['attempts'].values()); print(sys.argv[1], r['diagnosis']['file'], r['voice'])" /tmp/$e.json
          done
      # The SIL log replays (results/sil.md): both bundles' hashes, every replay re-derived from the recorded
      # inputs through the saved brains, standard library only, sockets refused in each worker.
      - name: The SIL log replays, re-checked offline
        run: |
          env -u MODEL_API_KEY -u BASETEN_API_KEY python3 -B -m blinkflow.sil.recheck examples/purple-box-sil > /tmp/sil-pb.json
          env -u MODEL_API_KEY -u BASETEN_API_KEY python3 -B -m blinkflow.sil.recheck examples/suite-sil > /tmp/sil-suite.json
          python3 -c "import json; a = json.load(open('/tmp/sil-pb.json')); b = json.load(open('/tmp/sil-suite.json')); assert a['passed'] and b['passed'] and b['processed'] == 8, (a, b); print(a['divergence_sha256'], b['classes'])"
